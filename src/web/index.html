<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#ffffff" />
    <title>Agent 空间</title>
  </head>
  <body>
    <div id="root">
      <section
        id="app-startup"
        role="status"
        style="
          min-height: 100dvh;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 18px;
          padding: 24px;
          box-sizing: border-box;
          background: var(--surface, #f5f9f7);
          color: var(--ink, #172823);
          font: 15px system-ui;
          text-align: center;
        "
      >
        <img src="/app-icon-192.png" alt="" width="64" height="64" style="border-radius: 18px" />
        <strong style="font-size: 22px">Agent 空间</strong>
        <p data-startup-status style="margin: 0; line-height: 1.7">正在打开…</p>
        <button
          hidden
          style="
            border: 1px solid currentColor;
            border-radius: 12px;
            padding: 12px 20px;
            background: transparent;
            color: inherit;
            font: inherit;
            cursor: pointer;
          "
        >
          重新加载应用
        </button>
      </section>
    </div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
