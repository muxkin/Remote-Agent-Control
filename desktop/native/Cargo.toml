[package]
name = "agent-space-native"
version = "0.3.13"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false
default-run = "agent-space-native"

[features]
default = ["ely"]
ely = ["dep:ely-core", "dep:gpui", "dep:gpui-platform", "dep:tray-icon", "dep:auto-launch", "dep:image", "dep:zbus"]
official-plugins = []

[[bin]]
name = "agent-space-adapter-dsh"
path = "src/bin/agent-space-adapter-dsh.rs"
required-features = ["official-plugins"]

[[bin]]
name = "agent-space-adapter-codex"
path = "src/bin/agent-space-adapter-codex.rs"
required-features = ["official-plugins"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
dirs = "6"
dotenvy = "0.15"
futures = "0.3"
jsonschema = { version = "0.61", default-features = false }
libp2p-core = "0.44"
libp2p-identity = { version = "0.3", features = ["ed25519", "peerid", "rand"] }
libp2p-noise = "0.47"
p256 = { version = "0.13.2", default-features = false, features = ["ecdh"] }
percent-encoding = "2"
pulldown-cmark = { version = "0.13", default-features = false }
rand = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "multipart", "stream"] }
ring = "0.17"
rusqlite = { version = "0.39", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util", "signal", "process", "fs"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["compat", "rt", "io"] }
toml = "1.2"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
webrtc = "0.21.1"

zstd = { version = "0.13", default-features = false }
ely-core = { version = "=0.2.0", optional = true }
gpui = { package = "gpui-pre", version = "=0.3.10", default-features = false, optional = true }
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.10", features = ["font-kit", "x11", "wayland"], optional = true }
tray-icon = { version = "=0.26.1", default-features = false, features = ["ksni"], optional = true }
auto-launch = { version = "=0.6.0", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "net", "process"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[build-dependencies]
embed-resource = "3.0.12"

[dev-dependencies]
rtc = { version = "0.21.1", default-features = false }

[profile.release]
strip = "symbols"
opt-level = "s"

[target.'cfg(windows)'.dependencies]
sysinfo = { version = "0.31", default-features = false, features = ["system"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Security_Authorization",
  "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Threading",
] }
