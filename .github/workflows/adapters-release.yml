name: Publish adapter release packages
on:
  push:
    tags: ['adapters-v*']
permissions:
  contents: write
jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/build-server.mjs
      - run: npm run test:adapters
      - run: npm run package:adapters
      - name: Publish independently installable packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/adapters/*.tgz dist/adapters/SHA256SUMS --title "$GITHUB_REF_NAME" --notes "Independent SDK, Codex and DSH packages. Install locally with npm run adapter -- install /path/to/release.tgz; upgrade a configured instance explicitly. Native Agents are never managed by the plugin host."
