name: Compatibility contracts
on:
  push:
    branches: ['**']
  pull_request:
concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/*/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build:adapters
      - run: npm run build:server
      - run: npm run build:web
      - run: npm run package:adapters
      - uses: actions/upload-artifact@v4
        with:
          name: verified-build
          path: |
            dist/
            packages/adapter-sdk/dist/
            packages/adapter-codex/dist/
            packages/adapter-dsh/dist/
          retention-days: 7
  native-connectors:
    needs: build-release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/*/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: verified-build
          path: .
      - run: npm test
        if: runner.os == 'Linux'
      - run: npx vitest run test/platform-connectors.test.ts packages/adapter-dsh/test/backend.test.ts packages/adapter-dsh/test/connection.test.ts test/adapter-host.test.ts test/adapter-manager.test.ts test/conversation-controls.test.ts test/store.test.ts
        if: runner.os != 'Linux'
      - run: npm run test:packages
