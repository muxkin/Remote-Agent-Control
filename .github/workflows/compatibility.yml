name: Compatibility contracts
on: [push, pull_request]
jobs:
  native-connectors:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npx vitest run test/platform-connectors.test.ts test/dsh.test.ts test/dsh-connection.test.ts test/store.test.ts
      - run: npm test
        if: runner.os == 'Linux'
      - run: npm run build
